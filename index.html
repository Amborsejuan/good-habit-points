<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>好習慣集點樂園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--r:20px}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;transition:background .3s;min-height:100vh}
/* ===== 史努比 & 帕洽狗 漫畫主題 (Snoopy / Pochacco) ===== */
body[data-theme=snoopy],body[data-theme=pochacco],body[data-theme=cinnamoroll]{--bg:#fff8ea;--bg2:#ffffff;--ink:#1d1d1d;--muted:#6a6256;--pri:#e63946;--pri2:#ffd166;--ok:#2a9d8f;--bad:#d62828;--line:#1d1d1d;--shadow:4px 4px 0 #1d1d1d;--bw:2.5px;
 background-color:#fff8ea;
 background-image:radial-gradient(#e6d7b8 1.4px,transparent 1.5px);
 background-size:16px 16px;}
/* ===== 雲朵主題 ===== */
body[data-theme=cloud]{--bg:#eaf5ff;--bg2:#ffffff;--ink:#3a5a80;--muted:#7f9bbd;--pri:#69b4ff;--pri2:#ffb3d1;--ok:#5cc9a7;--bad:#ff8fa3;--line:#d3e8ff;--shadow:0 6px 20px rgba(105,180,255,.18);--bw:0px;
 background:radial-gradient(circle at 15% 10%,#fff 0 60px,transparent 61px),radial-gradient(circle at 85% 4%,#fff 0 45px,transparent 46px),linear-gradient(#d7ecff,#f3f9ff 320px);}
/* ===== 漫畫主題 ===== */
body[data-theme=comic]{--bg:#fff8e6;--bg2:#ffffff;--ink:#1d1d1d;--muted:#6b6457;--pri:#ff6b4a;--pri2:#ffd23f;--ok:#2bb673;--bad:#ff4a4a;--line:#1d1d1d;--shadow:4px 4px 0 #1d1d1d;--bw:2.5px;
 background-color:#fff8e6;background-image:radial-gradient(#e9dcc0 1.3px,transparent 1.4px);background-size:14px 14px;}
body{color:var(--ink)}
.wrap{max-width:920px;margin:0 auto;padding:16px 14px 90px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header h1{font-size:20px;margin:0;flex:1;font-weight:900;letter-spacing:.5px}
body[data-theme=comic] header h1,body[data-theme=snoopy] header h1,body[data-theme=pochacco] header h1,body[data-theme=cinnamoroll] header h1{font-family:Bangers,"Noto Sans TC";font-size:25px;letter-spacing:1px}
.btn{border:var(--bw) solid var(--line);background:var(--bg2);color:var(--ink);border-radius:14px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s}
.btn:active{transform:translateY(2px)}
.btn.pri{background:var(--pri);color:#fff}
body[data-theme=comic] .btn.pri{color:#1d1d1d;background:var(--pri2)}
body[data-theme=snoopy] .btn.pri,body[data-theme=pochacco] .btn.pri,body[data-theme=cinnamoroll] .btn.pri{background:var(--pri);color:#fff}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.ghost{box-shadow:none;background:transparent}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.tab{flex:none;display:flex;align-items:center;gap:6px;padding:6px 14px 6px 6px;border-radius:999px;border:var(--bw) solid var(--line);background:var(--bg2);cursor:pointer;font-weight:700;color:var(--ink);font-family:inherit;font-size:15px;box-shadow:var(--shadow)}
.tab.on{background:var(--pri);color:#fff}
body[data-theme=comic] .tab.on,body[data-theme=snoopy] .tab.on,body[data-theme=pochacco] .tab.on,body[data-theme=cinnamoroll] .tab.on{background:var(--pri2);color:#1d1d1d}
.tab svg,.tab img{width:30px;height:30px}
img.av{object-fit:contain;border-radius:18px}
.tab img.av{border-radius:50%;object-fit:cover;background:#fff}
img.av.sad{filter:grayscale(.6);transform:rotate(-6deg)}
.card{background:var(--bg2);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.kids-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.kids-grid .hero{margin-bottom:0;cursor:pointer;transition:transform .12s}
.kids-grid .hero:active{transform:translateY(2px)}
.kids-grid .hero.active-kid{outline:3.5px solid var(--pri2);outline-offset:2px}
.kid-badge{display:inline-block;background:var(--pri2);color:#1d1d1d;border:2px solid #1d1d1d;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:900;margin-left:6px;vertical-align:middle}
.kid-tag{display:inline-block;background:var(--pri2);color:#1d1d1d;border:1.5px solid #1d1d1d;border-radius:8px;padding:0 6px;font-size:12px;font-weight:900;margin-right:6px}
.hero{display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;padding-bottom:24px}
body[data-theme=snoopy] .hero,body[data-theme=pochacco] .hero,body[data-theme=cinnamoroll] .hero{background:linear-gradient(180deg,#ffffff 0%,#fff9ed 88%,#e63946 88%,#e63946 100%)}
.hero .mascot{width:118px;height:118px;flex:none}
.hero .bal{flex:1;min-width:0}
.hero .label{color:var(--ink);font-weight:900;font-size:17px}
.hero .num{font-size:64px;font-weight:900;line-height:1;color:var(--pri)}
body[data-theme=comic] .hero .num,body[data-theme=snoopy] .hero .num,body[data-theme=pochacco] .hero .num,body[data-theme=cinnamoroll] .hero .num{font-family:Bangers;font-size:76px;color:var(--pri);-webkit-text-stroke:2px #1d1d1d}
.hero .sub{font-size:13px;color:var(--muted);margin-top:4px}
.next{margin-top:8px;font-size:13px;font-weight:700}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px;border:var(--bw) solid var(--line)}
body[data-theme=comic] .bar,body[data-theme=snoopy] .bar,body[data-theme=pochacco] .bar,body[data-theme=cinnamoroll] .bar{background:#fff}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:99px;transition:width .5s}
h2{font-size:17px;margin:0 0 10px;font-weight:900;display:flex;align-items:center;gap:8px}
body[data-theme=comic] h2,body[data-theme=snoopy] h2,body[data-theme=pochacco] h2,body[data-theme=cinnamoroll] h2{font-family:Bangers,"Noto Sans TC";font-size:22px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.rw{border:var(--bw) solid var(--line);border-radius:16px;padding:12px;text-align:center;background:var(--bg);position:relative;display:flex;flex-direction:column;justify-content:space-between}
body[data-theme=cloud] .rw{border:2px solid var(--line)}
.rw .em{font-size:38px}.rw .nm{font-weight:700;margin:4px 0}.rw .cs{font-weight:900;color:var(--pri)}
.rw.ready{outline:3px solid var(--ok);outline-offset:-3px}
.rw .tag{position:absolute;top:6px;right:6px;background:var(--ok);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
.rw .rw-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rw .rw-btns .btn{margin-top:0;flex:1;min-width:60px;padding:6px 6px;font-size:12px}
.log{list-style:none;margin:0;padding:0}
.logs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:10px}
.log-col{background:var(--bg);border:var(--bw) solid var(--line);border-radius:16px;padding:12px}
.log-col h3{margin:0 0 8px;font-size:16px;font-weight:900;display:flex;align-items:center;gap:6px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.log-col h3 svg,.log-col h3 img{width:28px;height:28px}
.log li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line)}
body[data-theme=comic] .log li,body[data-theme=snoopy] .log li,body[data-theme=pochacco] .log li,body[data-theme=cinnamoroll] .log li{border-bottom:1.5px dashed #bdb29a}
.log .d{font-weight:900;min-width:54px;text-align:center;border-radius:10px;padding:4px 0;color:#fff}
.log .d.p{background:var(--ok)}.log .d.m{background:var(--bad)}.log .d.r{background:var(--pri)}
.log .t{flex:1}.log .t b{display:block;font-size:15px}.log .t small{color:var(--muted)}
.log .who{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:0 7px;font-weight:700;color:var(--ink)}
.filters{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.chip{border:var(--bw) solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
body[data-theme=cloud] .chip{border:1.5px solid var(--line)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
body[data-theme=comic] .chip.on,body[data-theme=snoopy] .chip.on,body[data-theme=pochacco] .chip.on,body[data-theme=cinnamoroll] .chip.on{background:var(--pri2);color:#1d1d1d;border-color:#1d1d1d}
.chip.add{border-color:var(--ok)}.chip.sub{border-color:var(--bad)}
.parent{border-style:dashed}
.amts{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.amts .chip{min-width:44px;font-size:16px;font-weight:900}
input,select{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);width:100%;box-sizing:border-box}
body[data-theme=comic] input,body[data-theme=comic] select,body[data-theme=snoopy] input,body[data-theme=snoopy] select,body[data-theme=pochacco] input,body[data-theme=pochacco] select,body[data-theme=cinnamoroll] input,body[data-theme=cinnamoroll] select{border:2.5px solid #1d1d1d}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.seg{display:flex;border-radius:14px;overflow:hidden;border:var(--bw) solid var(--line);margin-bottom:8px}
.seg button{flex:1;border:0;padding:10px;font:inherit;font-weight:900;cursor:pointer;background:var(--bg);color:var(--ink)}
.seg button.on.a{background:var(--ok);color:#fff}.seg button.on.s{background:var(--bad);color:#fff}
.muted{color:var(--muted);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(20,30,50,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .card{width:100%;max-width:420px;max-height:88vh;overflow:auto;margin:0}
.pin{display:flex;gap:8px;justify-content:center;margin:14px 0}
.pin span{width:18px;height:18px;border-radius:50%;border:2px solid var(--pri)}
.pin span.f{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{padding:14px;font-size:22px}
.banner{background:#fff3cd;color:#7a5b00;border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.empty{text-align:center;padding:30px 10px}
.empty svg{width:140px;height:140px}
.list-edit li{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.list-edit{list-style:none;padding:0;margin:0 0 10px}
.burst{position:fixed;pointer-events:none;font-size:28px;z-index:99;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--rot));opacity:0}}
.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.25)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:98;font-size:14px}
.sec-title{font-weight:900;margin:14px 0 6px}
@media(max-width:520px){.kids-grid,.logs-grid{grid-template-columns:1fr}.hero .mascot{width:96px;height:96px}.hero .num{font-size:52px}body[data-theme=comic] .hero .num,body[data-theme=snoopy] .hero .num,body[data-theme=pochacco] .hero .num,body[data-theme=cinnamoroll] .hero .num{font-size:62px}}
</style>
</head>

/* ---------- 狀態 ---------- */
const DEFAULT_CONFIG={pin:'0000',presets:{
  add:['準時早起出門:2','自己刷牙洗臉:1','整理玩具書包:1','主動完成功課:2','準時上床睡覺:2','幫忙做家事:2','吃完飯不挑食:1','有禮貌說謝謝:1'],

}};
function parsePreset(s){const m=String(s||'').match(/^(.*?)[:：]\s*(\d+)\s*$/);return m?{text:m[1].trim(),pts:Math.max(1,parseInt(m[2])||1)}:{text:String(s||'').trim(),pts:null};}
const BIO_KEY='habit_points_bio_cred_v1';
const bioSupported=()=>!!(window.PublicKeyCredential&&navigator.credentials&&(location.protocol==='https:'||location.hostname==='localhost'));
const hasBio=()=>!!localStorage.getItem(BIO_KEY);
const b64ToBuf=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bufToB64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function setupBio(){
  if(!bioSupported()) return toast('此瀏覽器或不支援 Face ID / 指紋');
  try{
    const ch=crypto.getRandomValues(new Uint8Array(32));
    const uid=new TextEncoder().encode(myEmail()||'parent');
    const cred=await navigator.credentials.create({publicKey:{
      challenge:ch, rp:{name:'好習慣集點樂園',id:location.hostname},
      user:{id:uid,name:myEmail()||'parent',displayName:actorName()},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'}, timeout:60000
    }});
    localStorage.setItem(BIO_KEY,bufToB64(cred.rawId));
    toast('✅ 已啟用本裝置 Face ID / 指紋解鎖！'); render();
  }catch(e){ toast(e.name==='NotAllowedError'?'已取消生物辨識設定':'設定失敗：'+(e.message||e.name)); }
}
function disableBio(){ localStorage.removeItem(BIO_KEY); toast('已停用本裝置生物辨識'); render(); }
async function unlockBio(){
  const id=localStorage.getItem(BIO_KEY); if(!id) return;
  try{
    const ch=crypto.getRandomValues(new Uint8Array(32));
    await navigator.credentials.get({publicKey:{
      challenge:ch, rpId:location.hostname,
      allowCredentials:[{id:b64ToBuf(id),type:'public-key'}],
      userVerification:'required', timeout:60000
    }});
    UI.parent=true; UI.modal=UI.after==='settings'?{type:'settings'}:null; UI.after=null; UI.pinBuf='';
    toast('🔓 Face ID / 指紋驗證成功！'); render();
  }catch(e){ if(e.name!=='NotAllowedError') toast('生物辨識驗證失敗，請改用密碼'); }
}

async function put(col,id,data){
  if(db){ try{ await db.collection(col).doc(id).set(data);}catch(e){toast(e.code==='permission-denied'?'沒有寫入權限':'儲存失敗，請重試');throw e;} }
  else{ const arr=col==='config'?null:S[col]; if(col==='config'){S.config=data;} else{const i=arr.findIndex(x=>x.id===id); const o={id,...data}; i>=0?arr[i]=o:arr.push(o);} sortAll(); saveLocal(); render(); }
}
async function del(col,id){
  if(db){ await db.collection(col).doc(id).delete(); }
  else{ S[col]=S[col].filter(x=>x.id!==id); saveLocal(); render(); }
}

function sortAll(){S.kids.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));S.rewards.sort((a,b)=>a.cost-b.cost);S.logs.sort((a,b)=>b.ts-a.ts);}

async function changePoints(kid,delta,reason,type,extra={}){
  const bal=(kid.balance||0)+delta;
  const earned=(kid.earned||0)+(type==='add'?delta:0);
  const {id,...rest}=kid;
  await put('kids',kid.id,{...rest,balance:bal,earned});

}
async function doPoints(){
  const k=curKid(); if(!k)return;
  const reason=UI.reason.trim(); if(!reason){toast('請填寫原因');return;}
  const amt=Math.max(1,parseInt(UI.amt)||1);
  const delta=UI.mode==='add'?amt:-amt;
  await changePoints(k,delta,reason,UI.mode);
  UI.reason='';
  if(delta>0){burst(k.theme==='snoopy'?'🐾':(k.theme==='pochacco'||k.theme==='cinnamoroll')?'🐾':'⭐');toast(`${k.name} +${amt} 點！`);} else toast(`${k.name} −${amt} 點`);
  render(); const n=$(`[data-num="${k.id}"]`); n&&n.classList.add('pop');
}
async function redeem(rid,kidId){

    await changePoints(k,-r.cost,`兌換：${r.emoji||''}${r.name}`,'redeem',{rewardId:r.id});

  }}; render();
}
async function undoLog(lidv){
  const l=S.logs.find(x=>x.id===lidv); const k=S.kids.find(x=>x.id===l?.kidId); if(!l||!k)return;
  UI.modal={type:'confirm',text:`刪除這筆紀錄並${l.delta>0?'扣回':'補回'} ${Math.abs(l.delta)} 點？\n「${l.reason}」`,ok:async()=>{

    <div class="row"><button class="btn" data-act="mclose">取消</button><button class="btn pri" data-act="mok">確定</button></div></div></div>`;
  if(m.type==='settings'){
    const c=cfg();
    return `<div class="modal" data-close="1"><div class="card"><div class="row"><h2 style="margin:0">⚙️ 家長設定</h2><button class="btn sm ghost" style="flex:none" data-act="mclose">✕</button></div>
    <div class="sec-title">👧 孩子</div><ul class="list-edit">${S.kids.map(k=>`<li><input data-kname="${k.id}" value="${esc(k.name)}"><select data-ktheme="${k.id}" style="width:148px">${Object.entries(THEMES).map(([v,t])=>`<option value="${v}" ${(k.theme===v||(k.theme==='cinnamoroll'&&v==='pochacco'))?'selected':''}>${t}</option>`).join('')}</select><button class="btn sm bad" data-kdel="${k.id}">刪</button></li>
      <li style="margin:-2px 0 12px;font-size:13px">${face(k).replace('class="mascot','style="width:40px;height:40px" class="mascot')}
        <label class="btn sm" style="flex:none">🖼️ 上傳角色圖<input type="file" accept="image/*" data-avup="${k.id}" hidden></label>
        ${S.avatars[k.id]?`<button class="btn sm ghost" style="flex:none" data-avdel="${k.id}">改回預設</button>`:''}</li>`).join('')}</ul>
    <p class="muted" style="margin-top:-4px">角色圖會縮小後存到雲端，只有能開這個頁面的人看得到。建議用去背的 PNG。</p>
    <div class="row"><input id="newKid" placeholder="孩子名字"><select id="newKidTheme" style="width:148px">${Object.entries(THEMES).map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select><button class="btn sm pri" style="flex:none" data-act="addKid">新增</button></div>
    <div class="sec-title">🎁 獎品</div><ul class="list-edit">${S.rewards.map(r=>`<li><input data-remoji="${r.id}" value="${esc(r.emoji||'')}" style="width:54px;flex:none"><input data-rname="${r.id}" value="${esc(r.name)}"><input data-rcost="${r.id}" type="number" value="${r.cost}" style="width:74px;flex:none"><button class="btn sm bad" data-rdel="${r.id}">刪</button></li>`).join('')}</ul>
    <div class="row"><input id="newREmoji" placeholder="🎁" style="width:54px;flex:none"><input id="newRName" placeholder="獎品名稱"><input id="newRCost" type="number" placeholder="點數" style="width:74px;flex:none"><button class="btn sm pri" style="flex:none" data-act="addReward">新增</button></div>
    <div class="sec-title" style="display:flex;align-items:center;justify-content:space-between"><span>➕ 常用加點原因（可加 :點數）</span><button class="btn sm" data-act="loadDefaultPresets">套用預設分數</button></div><textarea id="presetAdd" rows="4" style="width:100%;box-sizing:border-box;font:inherit;border-radius:12px;padding:8px">${esc(c.presets.add.join('\n'))}</textarea>
    <div class="sec-title">➖ 常用扣點原因（可加 :點數，如：晚起拖拉出門遲到:2）</div><textarea id="presetSub" rows="4" style="width:100%;box-sizing:border-box;font:inherit;border-radius:12px;padding:8px">${esc(c.presets.sub.join('\n'))}</textarea>
    <div class="sec-title">🔑 家長密碼（4 位數字，儲存後全家同步生效）</div>
    <div class="row"><input id="pinIn" inputmode="numeric" maxlength="4" placeholder="請輸入 4 位數字" value="${esc(c.pin)}"><button class="btn sm pri" style="flex:none" data-act="savePin">儲存密碼</button></div>
    <div class="sec-title">🪪 Face ID / 指紋快速解鎖（此裝置專屬）</div>
    <div class="row">${hasBio()?`<span class="muted" style="color:var(--ok);font-weight:700">✅ 已啟用本裝置生物辨識</span><button class="btn sm bad" style="flex:none" data-act="disableBio">停用</button>`:`<button class="btn sm pri" data-act="setupBio">✨ 啟用本裝置 Face ID / 指紋</button>`}</div>
    <div class="sec-title">👤 帳號與稱呼（點數紀錄會顯示由誰加減）</div>
    <div class="row" style="margin-bottom:6px"><input id="myNick" placeholder="例如：爸爸、媽媽" value="${esc((c.nicknames&&c.nicknames[myEmail()])||AUTH.user?.name||'')}"><button class="btn sm" style="flex:none" data-act="signout">登出</button></div>
    <div class="muted" style="margin-bottom:6px">目前登入：${esc(AUTH.user?.email||'')}</div>
    <div class="row" style="margin-top:14px"><button class="btn pri" data-act="saveSettings">💾 儲存全部設定</button></div>
    <div class="sec-title">📦 備份</div>
    <div class="row"><button class="btn sm" data-act="exportBackup">⬇️ 匯出備份</button><label class="btn sm" style="text-align:center">⬆️ 匯入備份<input type="file" accept=".json,application/json" id="importIn" hidden></label></div>
    <p class="muted">建議每個月匯出一次，存在電腦或雲端硬碟。</p></div></div>`;
  }
  return '';
}

/* ---------- 事件 ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act],[data-kid],[data-logkid],[data-mode],[data-amt],[data-preset],[data-filter],[data-redeem],[data-undo],[data-pin],[data-kdel],[data-rdel],[data-avdel],[data-close]');
  if(!t) return;
  const d=t.dataset;
  if(d.close&&e.target!==t) return;
  if(d.close){UI.modal=null;UI.pinBuf='';return render();}
  if(d.kid){UI.kid=d.kid;return render();}
  if(d.logkid){UI.logKid=d.logkid;return render();}
  if(d.mode){UI.mode=d.mode;UI.reason='';return render();}
  if(d.amt){UI.amt=+d.amt;keepReason();return render();}
  if(d.preset){UI.reason=d.preset;if(d.ppts)UI.amt=+d.ppts;return render();}
  if(d.filter){UI.filter=d.filter;return render();}
  if(d.redeem) return redeem(d.redeem,d.rkid);
  if(d.undo) return undoLog(d.undo);
  if(d.pin!==undefined){
    const v=d.pin; if(v==='C')UI.pinBuf=''; else if(v==='⌫')UI.pinBuf=UI.pinBuf.slice(0,-1); else if(UI.pinBuf.length<4)UI.pinBuf+=v;
    UI.modal.err=false;
    if(UI.pinBuf.length===4){ if(UI.pinBuf===String(cfg().pin||'0000')){UI.parent=true;UI.modal=UI.after==='settings'?{type:'settings'}:null;UI.after=null;toast('已進入家長模式');} else {UI.modal.err=true;} UI.pinBuf=''; }
    return render();
  }
  if(d.kdel){const k=S.kids.find(x=>x.id===d.kdel);UI.modal={type:'confirm',text:`確定刪除「${k.name}」？（點數紀錄也會一併刪除）`,ok:async()=>{for(const l of S.logs.filter(l=>l.kidId===k.id))await del('logs',l.id);if(db)await db.collection('avatars').doc(k.id).delete().catch(()=>{});await del('kids',k.id);UI.modal={type:'settings'};render();}};return render();}
  if(d.rdel){await del('rewards',d.rdel);return render();}
  if(d.avdel){ if(db) await db.collection('avatars').doc(d.avdel).delete(); delete S.avatars[d.avdel]; toast('已改回預設角色'); return render(); }
  switch(d.act){
    case 'lock': if(UI.parent){UI.parent=false;toast('已離開家長模式');return render();} UI.modal={type:'pin'};UI.pinBuf=''; render(); if(hasBio()&&bioSupported()) unlockBio(); return;
    case 'settings': UI.modal={type:'settings'}; render(); return focusNewKid();
    case 'quickAddKid': if(!UI.parent){UI.after='settings';UI.modal={type:'pin'};UI.pinBuf='';render(); if(hasBio()&&bioSupported()) unlockBio(); return;} UI.modal={type:'settings'}; render(); return focusNewKid();
    case 'mclose': UI.modal=null; return render();
    case 'mok': return UI.modal.ok();
    case 'points': keepReason(); return doPoints();
    case 'addKid': return addKid();
    case 'addReward': return addReward();
    case 'savePin': return savePin();
    case 'setupBio': return setupBio();
    case 'disableBio': return disableBio();
    case 'unlockBio': return unlockBio();
    case 'loadDefaultPresets': {const a=$('#presetAdd'),s=$('#presetSub');if(a)a.value=DEFAULT_CONFIG.presets.add.join('\n');if(s)s.value=DEFAULT_CONFIG.presets.sub.join('\n');toast('已載入預設分數項目，記得按最下方「儲存全部設定」');return;}
    case 'resetPin': UI.modal={type:'confirm',text:'確定要將家長密碼重設回預設值「0000」嗎？',ok:async()=>{const c=cfg();await put('config','main',{pin:'0000',presets:c.presets,nicknames:c.nicknames||{}});UI.parent=true;UI.modal=null;toast('密碼已重設為 0000 並進入家長模式');render();}}; return render();
    case 'saveSettings': return saveSettings();
    case 'exportBackup': return exportBackup();
    case 'localPreview': return startLocalPreview();
    case 'signin': return window.FB&&window.FB.signIn();
    case 'signout': UI.modal=null; UI.parent=false; return window.FB&&window.FB.signOut();
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='reasonIn') UI.reason=e.target.value;
  if(e.target.id==='amtIn'){const v=parseInt(e.target.value);if(v>0){UI.amt=v;const k=curKid(),b=$('[data-act=points]');if(b)b.textContent=`幫 ${k?k.name:''} ${UI.mode==='add'?'加':'扣'} ${v} 點`;}}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='presetSel'){
    const idx=e.target.value;
    if(idx!==''){const p=parsePreset((cfg().presets[UI.mode]||[])[+idx]);if(p.text){UI.reason=p.text;UI.amt=p.pts||1;render();}}
    return;
  }
  if(e.target.id==='importIn'&&e.target.files[0]){ return importBackup(e.target.files[0]); }
  const id=e.target.dataset&&e.target.dataset.avup; if(!id||!e.target.files[0])return;
  try{
    const url=await shrink(e.target.files[0],320);
    if(db) await db.collection('avatars').doc(id).set({img:url,ts:Date.now()});
    S.avatars[id]=url; toast('角色圖已更新'); render();
  }catch(err){ toast('圖片讀取失敗，請換一張試試'); }
});
function shrink(file,max){return new Promise((ok,no)=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    let out=c.toDataURL('image/png'); if(out.length>180000) out=c.toDataURL('image/webp',.85); if(out.length>180000) out=c.toDataURL('image/jpeg',.8); ok(out);};
  img.onerror=no; img.src=u;});}
document.addEventListener('keydown',e=>{ if(e.key!=='Enter'||e.isComposing)return;
  if(e.target.id==='reasonIn'){keepReason();doPoints();}
  if(e.target.id==='newKid'){e.preventDefault();addKid();}
  if(['newRName','newRCost','newREmoji'].includes(e.target.id)){e.preventDefault();addReward();} });
let busy=false;
async function addKid(){ if(busy)return; const n=$('#newKid').value.trim(); if(!n)return toast('請輸入名字');
  busy=true; try{ await put('kids',newId('kids'),{name:n,theme:$('#newKidTheme').value,balance:0,earned:0,createdAt:Date.now()}); toast(`已新增 ${n}`);}catch(_){} finally{busy=false;}
  render(); focusNewKid(); }
async function addReward(){ if(busy)return; const n=$('#newRName').value.trim(),c=parseInt($('#newRCost').value); if(!n||!(c>0))return toast('請填名稱與點數');
  busy=true; try{ await put('rewards',newId('rewards'),{name:n,cost:c,emoji:$('#newREmoji').value.trim()||'🎁',createdAt:Date.now()}); toast(`已新增 ${n}`);}catch(_){} finally{busy=false;}
  render(); }
function focusNewKid(){ const i=$('#newKid'); if(i){ i.scrollIntoView({block:'center'}); } }
function keepReason(){const r=$('#reasonIn');if(r)UI.reason=r.value;}
async function savePin(){
  const pin=$('#pinIn').value.trim(); if(!/^\d{4}$/.test(pin)) return toast('密碼需為 4 位數字');
  const c=cfg();
  await put('config','main',{pin,presets:c.presets,nicknames:c.nicknames||{}});
  toast('家長密碼已更新並儲存！'); render();
}
async function saveSettings(){
  const pin=$('#pinIn').value.trim(); if(!/^\d{4}$/.test(pin)) return toast('密碼需為 4 位數字');
  const lines=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);
  const kidEdits=S.kids.map(k=>({k,name:$(`[data-kname="${k.id}"]`).value.trim()||k.name,theme:$(`[data-ktheme="${k.id}"]`).value}));
  const rEdits=S.rewards.map(r=>({r,emoji:$(`[data-remoji="${r.id}"]`).value.trim()||'🎁',name:$(`[data-rname="${r.id}"]`).value.trim()||r.name,cost:parseInt($(`[data-rcost="${r.id}"]`).value)||r.cost}));
  const nicknames=Object.assign({},cfg().nicknames||{});
  const me=myEmail(), nick=$('#myNick')?.value.trim();
  if(me&&nick) nicknames[me]=nick;
  await put('config','main',{pin,presets:{add:lines('#presetAdd'),sub:lines('#presetSub')},nicknames});
  for(const x of kidEdits) if(x.name!==x.k.name||x.theme!==x.k.theme){const {id,...rest}=x.k;await put('kids',id,{...rest,name:x.name,theme:x.theme});}
  for(const x of rEdits) if(x.name!==x.r.name||x.cost!==x.r.cost||x.emoji!==x.r.emoji){const {id,...rest}=x.r;await put('rewards',id,{...rest,name:x.name,cost:x.cost,emoji:x.emoji});}
  UI.modal=null; toast('設定已儲存'); render();
}

/* ---------- 啟動（由 Firebase 模組呼叫） ---------- */
let AUTH={state:'loading',user:null,err:''};
render();
setTimeout(()=>{if(AUTH.state==='loading')startLocalPreview();},1000);
function startLocalPreview(){
  if(!loadLocal()||!S.kids.length){
    S.kids=[
      {id:'rjirw60z019fshalwyk1',balance:0,createdAt:1795358193632,earned:0,name:'鈞鈞',theme:'pochacco'},
      {id:'vc8rzdt1dk82nu2fuckk',balance:0,createdAt:1795358503278,earned:1,name:'綸綸',theme:'snoopy'}
    ];
    S.logs=[
      {id:'vrf65n41sv3rdz3y9gvg',balanceAfter:0,delta:-1,kidId:'vc8rzdt1dk82nu2fuckk',reason:'拖拖拉拉',ts:1795359139174,type:'sub'},
      {id:'tfuk4f1dl19b7uij4fbp',balanceAfter:1,delta:1,kidId:'vc8rzdt1dk82nu2fuckk',reason:'準時上床睡覺',ts:1795358727237,type:'add'}
    ];
    saveLocal();
  }
  S.ready={c:true,k:true,r:true,l:true};
  AUTH={state:'in',user:{email:'本機儲存模式（設定 Firebase 後即自動開啟多裝置雲端同步）'},err:''};
  render();
}
window.APP={
  setAuth(a){AUTH=Object.assign(AUTH,a);render();},
  start(dbx){
    db=dbx; offline=false; S.ready={c:false,k:false,r:false,l:false};
    loadTimer=setTimeout(()=>{slow=true;render();},10000);
    const done=(key)=>{S.ready[key]=true;if(Object.values(S.ready).every(Boolean)){clearTimeout(loadTimer);slow=false;}};
    const onErr=key=>err=>{done(key); if(err.code==='permission-denied'){AUTH.state='denied';} else {offline=true;} render();};
    const keepModal=()=>UI.modal&&UI.modal.type==='settings'&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    db.doc('config/main').onSnapshot(s=>{S.config=s.exists?s.data():null;done('c');if(!keepModal())render();},onErr('c'));
    const sub=(col,key,q)=>q.onSnapshot(s=>{S[col]=s.docs.map(d=>({id:d.id,...d.data()}));sortAll();done(key);if(!keepModal())render();},onErr(key));
    sub('kids','k',db.collection('kids'));
    db.collection('avatars').onSnapshot(s=>{const m={};s.docs.forEach(d=>{const v=d.data();if(v&&typeof v.img==='string'&&/^data:image\//.test(v.img))m[d.id]=v.img;});S.avatars=m;if(!keepModal())render();},()=>{});
    sub('rewards','r',db.collection('rewards'));
    sub('logs','l',db.collection('logs').orderBy('ts','desc').limit(1000));
  }
};

/* ---------- 備份 ---------- */
function exportBackup(){
  const data={app:'good-habit-points',version:1,exportedAt:new Date().toISOString(),
    config:S.config, kids:S.kids, rewards:S.rewards, logs:S.logs, avatars:S.avatars};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  const d=new Date(); a.download=`points-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('備份已下載');
}
async function importBackup(file){
  let data; try{ data=JSON.parse(await file.text()); }catch(_){ return toast('檔案格式不對'); }
  if(!data||!Array.isArray(data.kids)) return toast('這不是集點備份檔');
  UI.modal={type:'confirm',text:`要匯入這份備份嗎？\n孩子 ${data.kids.length} 位、獎品 ${(data.rewards||[]).length} 個、紀錄 ${(data.logs||[]).length} 筆。\n相同的資料會被覆蓋，其他資料保留。`,ok:async()=>{
    UI.modal=null; render(); toast('匯入中…');
    try{
      if(data.config) await put('config','main',data.config);
      for(const col of ['kids','rewards','logs']) for(const x of (data[col]||[])){ const {id,...rest}=x; if(id) await put(col,String(id),rest); }
      for(const [id,img] of Object.entries(data.avatars||{})) if(db) await db.collection('avatars').doc(id).set({img,ts:Date.now()});
      toast('匯入完成！');
    }catch(e){ toast('匯入失敗：'+(e.code||e.message)); }
  }}; render();
}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, setDoc, deleteDoc, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";

if(!firebaseConfig || !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("請貼上")){
  startLocalPreview();
} else {
  const app = initializeApp(firebaseConfig);
  const fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  const auth = getAuth(app);
  const snapDoc = s => ({ id: s.id, exists: s.exists(), data: () => s.data(), metadata: s.metadata });
  const wrapDoc = r => ({ id: r.id, path: r.path,
    set: d => setDoc(r, d), delete: () => deleteDoc(r),
    onSnapshot: (cb, err) => onSnapshot(r, s => cb(snapDoc(s)), err) });
  const makeQ = (c, cons) => ({
    doc: id => wrapDoc(id ? doc(fs, c, id) : doc(collection(fs, c))),
    orderBy: (f, d) => makeQ(c, [...cons, orderBy(f, d || "asc")]),
    limit: n => makeQ(c, [...cons, limit(n)]),
    onSnapshot: (cb, err) => onSnapshot(query(collection(fs, c), ...cons),
      s => cb({ docs: s.docs.map(snapDoc), size: s.size, empty: s.empty, metadata: s.metadata }), err)
  });
  const dbx = { doc: p => wrapDoc(doc(fs, p)), collection: c => makeQ(c, []) };
  const provider = new GoogleAuthProvider();
  window.FB = {
    async signIn(){
      try { await signInWithPopup(auth, provider); }
      catch(e){
        if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") return signInWithRedirect(auth, provider);
        window.APP.setAuth({ err: e.code === "auth/unauthorized-domain" ? "這個網址還沒加到 Firebase 的授權網域（見 README 步驟）" : "登入失敗：" + e.code });
      }
    },
    signOut(){ return signOut(auth).then(()=>location.reload()); }
  };
  let started = false;
  onAuthStateChanged(auth, user => {
    if (!user) { window.APP.setAuth({ state: 'out', user: null }); return; }
    window.APP.setAuth({ state: 'in', user: { email: user.email, name: user.displayName || '' }, err: '' });
    if (!started) { started = true; window.APP.start(dbx); }
  });
}
</script>
